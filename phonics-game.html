<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFF9F0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<title>Sound It Out – ABC Fun!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="phonics-theme">

<button id="sound-toggle" aria-label="Toggle sound">🔊</button>
<a id="back-btn" href="index.html">← Home</a>

<header>
  <h1>🗣️ Sound It Out!</h1>
  <p>Tap the sounds, slide to blend, read the word!</p>
</header>

<div id="scorebar">
  <div class="score-pill">⭐ <span id="score">0</span></div>
  <div class="score-pill">🎯 Word <span id="round">1</span></div>
</div>

<div id="game">
  <div id="progress" class="dots-row"></div>

  <div id="phonics-card">
    <div id="phonics-emoji"></div>
    <div id="phonics-hint-text">Tap each sound!</div>
  </div>

  <div id="letter-tiles"></div>

  <div id="blend-track" aria-label="Slide to blend the sounds">
    <div id="blend-arrow"></div>
    <div id="blend-ball">👆</div>
  </div>

</div>

<div id="feedback" role="dialog" aria-modal="true">
  <div class="fb-emoji" id="fb-emoji">🎉</div>
  <div class="fb-msg"   id="fb-msg">Yay!</div>
  <div class="fb-sub"   id="fb-sub"></div>
</div>

<script src="js/shared.js"></script>
<script src="js/phonics-game.js"></script>
</body>
</html>
